name: Folio search input UI validation
on:
  push:
    branches:
      - fix/chat-search-font-awesome-icon-20261113
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check source syntax
        run: node --check index.js
      - name: Verify scoped search icon and native input styles
        run: |
          node <<'NODE'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const js = fs.readFileSync('index.js','utf8');
          const css = fs.readFileSync('style.css','utf8');
          const ko = JSON.parse(fs.readFileSync('i18n/ko-kr.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          assert(ko['folio.search.chats'] === '채팅방 검색');
          assert(manifest.version === '1.5.4');
          assert(js.includes("const searchIcon = createElement('i', 'folio-chat-search-icon fa-solid fa-magnifying-glass');"));
          assert(js.includes("searchIcon.setAttribute('aria-hidden', 'true')"));
          assert(js.includes("searchWrap.append(searchIcon, search)"));
          assert(js.includes("let searchWrap = container.querySelector('.folio-chat-search-wrap')"));
          assert(js.includes("const matchingChats = query ? sortedChats.filter("));
          const chatInputBlock = js.slice(js.indexOf("let searchWrap = container.querySelector('.folio-chat-search-wrap')"), js.indexOf("const content = createElement('div', 'folio-chat-content')"));
          assert(!chatInputBlock.includes("searchWrap.appendChild(search)"));
          const block=css.slice(css.indexOf('.folio-chat-search-wrap {'),css.indexOf('.folio-chat-results {'));
          assert(block.includes('width: 50%'));
          assert(block.includes('margin: 3px 0 10px auto'));
          assert(block.includes('font-size: clamp(16px, 0.84em, 18px)'));
          assert(block.includes('padding: 5px 9px 5px 30px'));
          assert(block.includes('pointer-events: none'));
          assert(block.includes('.folio-chat-search::-webkit-search-decoration'));
          console.log('Search icon, text size, layout, iOS minimum size and localization verified.');
          NODE
      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD
