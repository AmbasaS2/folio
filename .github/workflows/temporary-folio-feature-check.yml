name: Folio feature regression
on:
  push:
    branches:
      - feature/chat-search-pins-random-i18n-20261113
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: JavaScript syntax
        run: node --check index.js
      - name: Test random sort stability, pinned chat migration, search and locales
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const js=fs.readFileSync('index.js','utf8');
          const html=fs.readFileSync('settings.html','utf8');
          const css=fs.readFileSync('style.css','utf8');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const between=(start,end)=>{
            const a=js.indexOf(start),b=js.indexOf(end,a);
            assert(a>=0 && b>a, 'Missing code section '+start);
            return js.slice(a,b);
          };
          // No additional chat or image requests for randomized sorting.
          const randomSource=between('function compareByRecent(', 'function getAvailableTags(');
          const math=Object.create(Math);
          math.random=()=>0;
          const chars=Array.from({length:9},(_,i)=>({avatar:'c'+i,name:'Character '+i,date_last_chat:i,chat_size:9-i}));
          const randomCtx={
            Math:math,
            getAvatarKey:char=>char?.avatar||'',
            getCharacterName:char=>char?.name||'',
            parseTimestamp:v=>Number(v)||0,
            parseChatSize:v=>Number(v)||0,
            sessionRecentByAvatar:new Map(),
            getStoredPinnedAvatars:()=>['c2'],
            safeContext:()=>({characters:chars}),
            collator:new Intl.Collator('en',{numeric:true}),
          };
          vm.createContext(randomCtx);
          vm.runInContext("let currentSortMode='random';const randomOrderByAvatar=new Map();"+randomSource,randomCtx);
          const sorted=()=>Array.from(randomCtx.getCharactersForDisplay({characters:chars})).map(x=>x.character.avatar);
          const order1=sorted(),order2=sorted();
          assert.equal(order1.join(','),order2.join(','),'Random sort changed during re-render/page flip');
          assert.equal(order1[0],'c2','Pinned character must remain on top');
          randomCtx.shuffleCharacterOrder({characters:chars});
          const reroll=sorted();
          assert.notEqual(order1.join(','),reroll.join(','),'Reselecting Random must reshuffle');
          assert.equal(reroll[0],'c2');
          assert(!randomSource.includes('fetch('),'Random sort should not fetch data');
          // Pinned chat metadata is stored per avatar and preserved across renames.
          const pinSource=between('function getPinnedChatIds(', 'function getStoredPinnedAvatars(');
          const prefs={extensionSettings:{},saves:0,saveSettingsDebounced(){this.saves+=1}};
          const pinCtx={
            context:()=>prefs,safeContext:()=>prefs,
            ensureModuleSettings:c=>c.extensionSettings.characterFolio||={},
            cleanEmptySettings:c=>{if(!Object.keys(c.extensionSettings.characterFolio||{}).length)delete c.extensionSettings.characterFolio},
            getAvatarKey:char=>char.avatar,
            renderChatRows:()=>{throw new Error('Unexpected UI update during storage test')},
            activeChatState:null,currentChatPage:1,
            MODULE_NAME:'characterFolio',
          };
          vm.createContext(pinCtx);
          vm.runInContext(pinSource,pinCtx);
          const pinned=(avatar)=>Array.from(pinCtx.getPinnedChatIds(avatar));
          pinCtx.togglePinnedChat('remus','Paris');
          pinCtx.togglePinnedChat('remus','Hogwarts');
          pinCtx.togglePinnedChat('harry','London');
          assert.equal(pinned('remus').join(','),'Paris,Hogwarts');
          assert.equal(pinned('harry').join(','),'London');
          pinCtx.migratePinnedChatId('remus','Paris','Paris 1981');
          assert.equal(pinned('remus').join(','),'Paris 1981,Hogwarts');
          pinCtx.removePinnedChatId('remus','Hogwarts');
          assert.equal(pinned('remus').join(','),'Paris 1981');
          pinCtx.migratePinnedChatsForAvatar('remus','remus-new');
          assert.equal(pinned('remus').length,0);
          assert.equal(pinned('remus-new').join(','),'Paris 1981');
          pinCtx.deletePinnedChatsForAvatar('remus-new');
          assert.equal(pinned('remus-new').length,0);
          assert.equal(pinned('harry').join(','),'London');
          assert(prefs.saves>=5);
          // Search filters titles already loaded and counts pages after filtering.
          const searchBody=between("    const query = currentChatSearch.trim().toLocaleLowerCase();","    let searchWrap = container.querySelector('.folio-chat-search-wrap');");
          const searchCtx={currentChatSearch:'paris', currentChatPage:6,settings:{chatPageSize:2},
            sortedChats:[{title:'Paris 1981'},{title:'London'},{title:'PARIS 1982'},{title:'Paris revisit'}],
            safeChats:[],character:{},container:{},activeChatState:null};
          vm.createContext(searchCtx);
          vm.runInContext(searchBody+"globalThis.searchResults={titles:visibleChats.map(x=>x.title),page:currentChatPage,pages:totalPages,count:matchingChats.length};",searchCtx);
          assert.equal(searchCtx.searchResults.pages,2);
          assert.equal(searchCtx.searchResults.page,2);
          assert.equal(searchCtx.searchResults.count,3);
          assert.equal(searchCtx.searchResults.titles.join(','),'Paris revisit');
          const render=between('function renderChatRows(', 'async function fetchCharacterChats(');
          assert(render.includes("search.addEventListener('input',"));
          assert(render.includes("let searchWrap = container.querySelector('.folio-chat-search-wrap');"));
          assert(render.includes('results.replaceChildren(content, footer)'));
          assert(!render.includes('fetchCharacterChats('),'Typing must not fetch files');
          assert(js.includes("migratePinnedChatId(avatar, chat.fileId, newName)"));
          assert(js.includes("removePinnedChatId(avatar, chat.fileId)"));
          assert(js.includes("migratePinnedChatsForAvatar(oldAvatar, newAvatar)"));
          assert(js.includes("deletePinnedChatsForAvatar(avatar)"));
          // Portrait page size is horizontal columns × vertical rows, not the legacy fixed count.
          const settingsDefs=between('const PORTRAIT_SCALES = ', 'const DEFAULT_SORT_MODE = ');
          const settingReader=between('function normalizeSettingValue(', 'function isRuntimeCurrent(');
          const pageCalc=between('function getPortraitsPerPage(', 'function handlePortraitPageBreakpointChange(');
          const legacyStore={extensionSettings:{characterFolio:{characterPageSize:3,portraitScale:120}}};
          const pageCtx={
            MODULE_NAME:'characterFolio',
            safeContext:()=>legacyStore,
            matchMedia:()=>({matches:pageCtx.isMobile}),
            isMobile:false,
          };
          vm.createContext(pageCtx);
          vm.runInContext(settingsDefs+settingReader+pageCalc,pageCtx);
          const getSettings=()=>vm.runInContext('getFolioSettings()',pageCtx);
          const pageSize=()=>vm.runInContext('getPortraitsPerPage()',pageCtx);
          assert.equal(getSettings().desktopColumns,3);
          assert.equal(getSettings().mobileColumns,3);
          assert.equal(getSettings().portraitRows,4);
          assert.equal(getSettings().characterPageSize,3,'Legacy fixed value must remain available for rollback');
          assert.equal(pageSize(),12,'Default portrait page has 3 × 4');
          pageCtx.isMobile=true;
          assert.equal(pageSize(),12);
          legacyStore.extensionSettings.characterFolio.desktopColumns=7;
          legacyStore.extensionSettings.characterFolio.mobileColumns=5;
          legacyStore.extensionSettings.characterFolio.portraitRows=8;
          assert.equal(pageSize(),40,'Mobile uses mobile horizontal count × rows');
          pageCtx.isMobile=false;
          assert.equal(pageSize(),56,'Desktop uses desktop horizontal count × rows');
          assert.equal(legacyStore.extensionSettings.characterFolio.characterPageSize,3,'Legacy fixed count was not erased');
          const resetOld=legacyStore.extensionSettings.characterFolio;
          resetOld.portraitRows=999;
          assert.equal(getSettings().portraitRows,4,'Out-of-range rows should use default');
          assert(js.includes("key === 'desktopColumns' || key === 'mobileColumns' || key === 'portraitRows'"));
          assert(js.includes('bindPortraitPageBreakpoint();'));
          assert(js.includes('unbindPortraitPageBreakpoint();'));
          assert(js.includes("query.addEventListener('change', handlePortraitPageBreakpointChange)"));
          const characterRender=between('function renderCharacterGrid(', 'function updateVisibleNote(');
          assert(characterRender.includes('const portraitsPerPage = getPortraitsPerPage(settings);'));
          assert(!characterRender.includes('settings.characterPageSize'), 'Legacy page count must not drive pagination');
          // Native i18n and numeric options, with unchanged stored names/IDs.
          const start='const UI_ENGLISH = Object.freeze(';
          const en=JSON.parse(between(start,');\nfunction tr(').slice(start.length));
          assert.equal(Object.keys(en).length,92);
          const locales=['ko-kr','ja-jp','zh-cn','zh-tw','es-es'];
          for(const locale of locales){
            const data=JSON.parse(fs.readFileSync('i18n/'+locale+'.json','utf8'));
            const all=Object.keys(en);
            assert.equal(Object.keys(data).length,all.length,locale+' missing keys');
            for(const key of all){
              const value=data['folio.'+key];
              assert(typeof value==='string'&&value.length,locale+' missing '+key);
              const placeholders=s=>[...s.matchAll(/\{\d+\}/g)].map(x=>x[0]).sort().join(',');
              assert.equal(placeholders(value),placeholders(en[key]),locale+' placeholder mismatch: '+key);
            }
            assert.equal(manifest.i18n[locale],'i18n/'+locale+'.json');
          }
          const htmlKeys=[...html.matchAll(/data-folio-i18n="([^"]+)"/g)].map(x=>x[1]);
          assert.equal(htmlKeys.length,18);
          for(const key of htmlKeys)assert(Object.hasOwn(en,key));
          assert.equal([...html.matchAll(/data-folio-count="/g)].length,11);
          assert.equal([...html.matchAll(/data-folio-rows="/g)].length,8);
          assert(html.includes('<option value="4" selected data-folio-rows="4">4줄</option>'));
          assert(!html.includes('id="folio-character-page-size"'));
          assert(html.includes('초상화 노출 설정')&&html.includes('노출 개수')&&html.includes('세로 줄 수'));
          const orderedIds=['folio-enabled','folio-image-quality','folio-portrait-ratio','folio-desktop-columns','folio-mobile-columns','folio-portrait-rows','folio-corner-style','folio-chat-page-size','folio-font-scale','folio-data-cleanup'];
          const positions=orderedIds.map(id=>html.indexOf('id="'+id+'"'));
          assert(positions.every(p=>p>=0));
          assert(positions.every((p,i)=>i===0||p>positions[i-1]),'Settings controls out of requested order');
          assert(css.includes('grid-template-columns: repeat(3, minmax(0, 1fr))'));
          assert(css.includes('padding-block: 0 24px;'));
          assert(js.includes("option.textContent = tr('unit.rows'"));
          assert(js.includes("option.textContent = tr('unit.count'"));
          assert(css.includes('.folio-chat-search-wrap'));
          assert(css.includes('.folio-chat-pinned-icon'));
          assert.equal(manifest.version,'1.4.0');
          console.log('Folio random, pin, search, portrait row pagination, responsive breakpoint and i18n checks passed.');
          NODE
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
